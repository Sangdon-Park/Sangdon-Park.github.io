<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>익명 짝 코드 리뷰 · Algorithm Lab</title><link rel="stylesheet" href="peer-review.css?v=20261021-1"></head>
<body><header><a href="./">Algorithm Lab</a><h1>익명 짝 코드 리뷰</h1><nav><a id="back-link" href="./">코딩연습으로</a><button id="locale-toggle" type="button">English</button></nav></header>
<main><p id="notice">같은 분반·문제·언어에서 풀이 진행도가 비슷한 학생과 익명으로 서로의 코드를 검토합니다.</p><p id="status" role="status" aria-live="polite"></p>
<section id="login" hidden><h2>실습 계정 연결</h2><form id="login-form"><label>분반<select name="section"><option>01</option><option>02</option></select></label><label>학번<input name="student_no" required pattern="[0-9]{6,12}" inputmode="numeric"></label><label>이름<input name="name" required maxlength="40"></label><button>연결하기</button></form></section>
<div id="workspace" hidden><div class="toolbar"><button id="new-review" type="button">내 풀이로 리뷰 신청</button><button id="refresh" type="button">새로고침</button><button id="export-list" type="button" hidden>목록 CSV</button></div><div class="columns"><aside><h2 id="list-heading">내 리뷰 기록</h2><div id="review-list"></div></aside><article id="detail"><h2>코드를 공유하고 서로 개선해 보세요.</h2><p>리뷰 신청 후 원본 코드와 설명을 보존합니다. 서로 의견을 제출하면 받은 피드백을 확인하고 수정·성찰을 남길 수 있습니다.</p></article></div></div></main>
